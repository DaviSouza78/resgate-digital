name: Esteira Resgate Digital
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: esteira-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Dependências e auditoria de produção
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm sbom --sbom-format=cyclonedx > /tmp/rd-sbom.json
          python -m pip install reportlab==4.4.10 pypdf==6.10.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --prefix /tmp/rd-tools playwright@1.62.1
          /tmp/rd-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Gitleaks no histórico completo
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          mkdir -p output/relatorios
          /tmp/gitleaks git --redact --report-format json --report-path output/relatorios/gitleaks.json --log-opts='--all'
      - name: Lint, testes, GDD e reprodutibilidade
        run: |
          npm run lint
          npm run test:coverage
          python scripts/gdd_pdf.py
          npm run test:reproducible
          npm run triagem
          cp /tmp/rd-sbom.json output/relatorios/npm-sbom.cdx.json
      - name: E2E offline, vídeo real e relatório
        env:
          RESGATE_DIGITAL_PLAYWRIGHT_PATH: /tmp/rd-tools/node_modules/playwright
        run: |
          npm run test:e2e
          node scripts/pitch.cjs
          node scripts/dora-report.cjs
          node scripts/review-evidence.cjs
          python scripts/report_pdf.py
          npm run build:site
          python scripts/package-site.py
          python scripts/submission.py
      - name: E2E do site HTTP
        env:
          RESGATE_DIGITAL_PLAYWRIGHT_PATH: /tmp/rd-tools/node_modules/playwright
        run: |
          npm run preview > /tmp/rd-preview.log 2>&1 &
          sleep 2
          npm run test:site
      - uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: site/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencias
          path: |
            output/relatorios/
            output/pdf/
            output/video/pitch.*
            output/*.zip
            output/*.sha256
  deploy-hml:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: site-build
          path: site
      - name: Publicar homologação sem recompilar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-pages.cjs hml
      - name: Regressão contra homologação
        env:
          SITE_TEST_URL: https://${{ github.repository_owner }}.github.io/resgate-digital/hml/
          EXPECTED_COMMIT: ${{ github.sha }}
          RESGATE_DIGITAL_PLAYWRIGHT_PATH: /tmp/rd-tools/node_modules/playwright
        run: |
          npm install --prefix /tmp/rd-tools playwright@1.62.1
          /tmp/rd-tools/node_modules/.bin/playwright install --with-deps chromium
          node scripts/smoke.cjs
  deploy-prd:
    needs: deploy-hml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: producao
      url: https://${{ github.repository_owner }}.github.io/resgate-digital/
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: site-build
          path: site
      - name: Promover artefato por azul-verde
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-pages.cjs production
      - name: Smoke de produção
        id: smoke
        continue-on-error: true
        env:
          SITE_TEST_URL: https://${{ github.repository_owner }}.github.io/resgate-digital/
          EXPECTED_COMMIT: ${{ github.sha }}
          RESGATE_DIGITAL_PLAYWRIGHT_PATH: /tmp/rd-tools/node_modules/playwright
        run: |
          npm install --prefix /tmp/rd-tools playwright@1.62.1
          /tmp/rd-tools/node_modules/.bin/playwright install --with-deps chromium
          node scripts/smoke.cjs
      - name: Rollback se o smoke falhar
        if: steps.smoke.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/publish-pages.cjs rollback
          exit 1
  releases:
    needs: deploy-prd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: site-build
          path: site
      - name: Publicar as doze releases a partir do mesmo build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/releases.cjs
