<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Wireframes de seleção, HUD e fim do jogo Resgate Digital">
 <rect width="1100" height="620" fill="#f5f7f2"/>
 <g font-family="Arial,sans-serif" fill="#153843"><text x="30" y="40" font-size="23" font-weight="bold">Resgate Digital — wireframes das telas</text>
 <g transform="translate(30 70)"><rect width="320" height="510" rx="12" fill="white" stroke="#a9bdb0"/><text x="20" y="35" font-size="18" font-weight="bold">1. Seleção de missão</text><rect x="20" y="60" width="280" height="55" fill="#eaf0dd"/><text x="35" y="94" font-size="16">Título + proposta educativa</text><text x="20" y="150" font-size="14">Missões disponíveis</text><g fill="#eaf0dd"><rect x="20" y="170" width="280" height="42"/><rect x="20" y="222" width="280" height="42"/><rect x="20" y="274" width="280" height="42"/><rect x="20" y="326" width="280" height="42"/><rect x="20" y="378" width="280" height="42"/></g><g font-size="14"><text x="35" y="197">1. Sequência</text><text x="35" y="249">2. Direção</text><text x="35" y="301">3. Repetição</text><text x="35" y="353">4. Depuração</text><text x="35" y="405">5. Condição</text><text x="20" y="470">Ajuda · versão · privacidade</text></g></g>
 <g transform="translate(390 70)"><rect width="320" height="510" rx="12" fill="white" stroke="#a9bdb0"/><text x="20" y="35" font-size="18" font-weight="bold">2. HUD / partida</text><rect x="20" y="60" width="280" height="175" fill="#125161"/><g stroke="#497b80"><path d="M76 60v175M132 60v175M188 60v175M244 60v175M20 95h280M20 130h280M20 165h280M20 200h280"/></g><text x="40" y="155" fill="#ffcd73" font-size="23">R</text><text x="220" y="120" fill="#e5f789" font-size="23">◇</text><text x="20" y="265" font-size="14">Comandos e contador de blocos</text><rect x="20" y="282" width="280" height="45" fill="#eaf0dd"/><text x="35" y="310" font-size="14">↑  ↶  ↷  ↻  ◇</text><text x="20" y="356" font-size="14">Programa na ordem de execução</text><rect x="20" y="375" width="130" height="40" fill="#006963"/><text x="35" y="401" fill="white" font-size="14">Executar</text><rect x="160" y="375" width="140" height="40" fill="#eaf0dd"/><text x="175" y="401" font-size="14">Reiniciar</text><text x="20" y="455" font-size="14">Status textual · conceito · dica</text></g>
 <g transform="translate(750 70)"><rect width="320" height="510" rx="12" fill="white" stroke="#a9bdb0"/><text x="20" y="35" font-size="18" font-weight="bold">3. Fim / vitória</text><rect x="20" y="90" width="280" height="310" rx="14" fill="#eaf0dd"/><text x="40" y="145" font-size="22" font-weight="bold">Estação recuperada!</text><text x="40" y="192" font-size="23">★ ★ ★</text><text x="40" y="230" font-size="16">Pontos + blocos usados</text><text x="40" y="270" font-size="14">Explicação do conceito aprendido</text><rect x="40" y="300" width="240" height="40" fill="#006963"/><text x="65" y="326" fill="white" font-size="14">Próxima missão</text><text x="55" y="375" font-size="14">Melhorar meu programa</text><text x="20" y="455" font-size="14">Falha: feedback no HUD, sem modal.</text><text x="20" y="480" font-size="14">Tentativas e dicas ilimitadas.</text></g></g>
</svg>
